name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - name: Install Linux font dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 fonts-liberation fonts-crosextra-carlito
      - name: Run tests
        run: bash .github/scripts/test.sh 10.0
      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # Non-tag builds (workflow_dispatch) produce a prerelease package that is never published.
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"
      - name: Pack
        run: |
          for project in CompoundFile/CompoundFile.csproj SpreadSheet/SpreadSheet.csproj; do
            dotnet pack "$project" --configuration Release --output artifacts \
              -p:GeneratePackageOnBuild=false \
              -p:Version=${{ steps.version.outputs.version }} \
              -p:ContinuousIntegrationBuild=true \
              -p:IncludeSymbols=true \
              -p:SymbolPackageFormat=snupkg
          done
          ls -l artifacts
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  publish-nuget:
    name: Publish to nuget.org
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # required for NuGet trusted publishing (OIDC)
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: Lafriks
      - name: Push packages
        run: |
          dotnet nuget push 'artifacts/*.nupkg' \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --skip-duplicate

  publish-github:
    name: Publish to GitHub Packages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts
      - name: Push packages
        run: |
          dotnet nuget push 'artifacts/*.nupkg' \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --no-symbols \
            --skip-duplicate
