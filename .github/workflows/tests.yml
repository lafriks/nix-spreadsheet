name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }} (.NET ${{ matrix.dotnet }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        dotnet: ['8.0', '9.0', '10.0']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}.x
      - name: Run tests
        run: bash .github/scripts/test.sh ${{ matrix.dotnet }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}-net${{ matrix.dotnet }}
          path: SpreadSheet.Tests/TestResults/*.trx

  linux:
    name: Linux Alpine (.NET ${{ matrix.dotnet }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dotnet: ['8.0', '9.0', '10.0']
    steps:
      - uses: actions/checkout@v7
      - name: Run tests in Alpine
        shell: bash
        run: |
          docker run --rm \
            --volume "$PWD:/src" \
            --workdir /src \
            mcr.microsoft.com/dotnet/sdk:${{ matrix.dotnet }}-alpine \
            sh .github/scripts/test.sh ${{ matrix.dotnet }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-alpine-net${{ matrix.dotnet }}
          path: SpreadSheet.Tests/TestResults/*.trx
